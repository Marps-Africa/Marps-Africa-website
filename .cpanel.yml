deployment:
  method: git
  remote: origin
  branch: marps  # your working branch

build:
  commands:
    - cd public_html/frontend         # Navigate to the frontend directory
    - npm install                     # Install dependencies
    - npm run build                   # Build the project for production
    - mv dist/* ../                   # Move built files to public_html

start:
  commands:
    - cd public_html                  # Navigate to the public_html directory
    - npm run serve                   # Start the production server (if applicable)
